name: Deploy develop to Railway

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-railway-develop
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy + seed on boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # Prefer GitHub Actions variable when set; otherwise the known staging service.
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || 'thorough-victory' }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify Railway secrets
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Missing GitHub secret RAILWAY_TOKEN (Railway project token for the develop/staging environment)."
            exit 1
          fi
          if [ -z "$RAILWAY_SERVICE" ]; then
            echo "::error::Missing Railway service name."
            exit 1
          fi
          echo "Deploying to Railway service: $RAILWAY_SERVICE"

      - name: Deploy to Railway
        run: railway up --ci --detach --service "$RAILWAY_SERVICE"

      # Seed runs inside the container on boot via `npm run start:migrate`
      # (migrate → db:seed → server). Set SEED_SUPER_ADMIN_* on the Railway
      # service variables for the first deploy; seed is idempotent afterward.
      - name: Note seed on boot
        run: |
          echo "Deployment uploaded. Railway start command runs: prisma migrate deploy && npm run db:seed && node dist/server.js"
          echo "Ensure Railway service variables include SEED_SUPER_ADMIN_EMAIL and SEED_SUPER_ADMIN_PASSWORD (min 10 chars) for the first boot."
