services:
  postgres:
    image: postgres:16-alpine
    container_name: metro_crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-metro_crm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-metro_crm}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - metro_crm_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metro_crm_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-metro_crm}?schema=public
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metro_crm_network

volumes:
  postgres_data:
    driver: local

networks:
  metro_crm_network:
    driver: bridge
